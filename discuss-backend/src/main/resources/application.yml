
spring:
  application:
    name: discuss

  mongodb:
    uri: mongodb://localhost:27017/discuss

  data:
    mongodb:
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379
      timeout: 2s

jwt:
  secret: ${DISCUSS_JWT_SECRET}
  expiration-ms: 900000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG