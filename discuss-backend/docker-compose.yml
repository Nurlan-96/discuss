services:

  mongodb:
    image: mongo:8
    container_name: discuss-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: discuss
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine
    container_name: discuss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: